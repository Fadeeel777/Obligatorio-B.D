services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_docker}
    volumes:
      - ./docker/mysql.cnf:/etc/mysql/conf.d/torneo.cnf:ro
      - "./base de datos:/docker-entrypoint-initdb.d:ro"
      - datos_mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: ./Backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: torneo_futbol5
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_docker}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-clave_local_docker_cambiar}
      DB_LOGIN_USER: login_app
      DB_LOGIN_PASSWORD: cambiar_clave_login
      DB_ADMIN_USER: admin_app
      DB_ADMIN_PASSWORD: cambiar_clave_admin
      DB_PLANILLERO_USER: planillero_app
      DB_PLANILLERO_PASSWORD: cambiar_clave_planillero
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_mysql:
